[package]
name = "browser"
version = "0.7.0"
edition = "2021"
publish = false
description = "æther's web browser: a from-scratch HTML/CSS engine, picture decoders, script engine and tabbed shell"

# Both come from the Aether repository, at the commit Cargo.lock pins
# (`cargo update -p webnet -p aether-host` moves to Aether's latest main).
# Neither pulls in anything from crates.io.
[dependencies]
# Windows, input and the raw æther calls: the only `unsafe` code the browser runs.
aether-host = { git = "https://github.com/traxsdata/Aether", branch = "main" }
# The network layer (URLs, HTTP/1.1, TLS 1.3 and 1.2). The browser only uses
# it through src/net.rs.
webnet = { git = "https://github.com/traxsdata/Aether", branch = "main" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Debug builds of the dependencies are needlessly slow.
[profile.dev.package."*"]
opt-level = 2
